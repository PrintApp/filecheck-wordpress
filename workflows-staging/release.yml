name: Release plugin

# Pushing a version tag (e.g. v1.0.2 or 1.0.2) will:
#   1. Verify the tag matches the version in filecheck.php and readme.txt
#   2. Deploy the plugin to the WordPress.org SVN repository
#      (https://plugins.svn.wordpress.org/filecheck), including the
#      .wordpress-org listing assets (banners, icons, screenshots)
#   3. Create a GitHub release with the same distributable zip
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SVN_USERNAME  -> printapp   (case sensitive, NOT the email address)
#   SVN_PASSWORD  -> the SVN-specific password from
#                    https://profiles.wordpress.org/printapp/profile/edit/group/3/?screen=svn-password

on:
  push:
    tags:
      - 'v*'                    # e.g. v1.0.2
      - '[0-9]+.[0-9]+.[0-9]+'  # e.g. 1.0.2

permissions:
  contents: write   # required to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"   # strip a leading "v" if present
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        run: |
          HEADER_VERSION=$(grep -oiP '^\s*\*\s*Version:\s*\K[0-9A-Za-z.\-]+' filecheck.php | head -n1)
          README_VERSION=$(grep -oiP '^Stable tag:\s*\K[0-9A-Za-z.\-]+' readme.txt | head -n1)
          CONST_VERSION=$(grep -oP "FILECHECK_VERSION',\s*'\K[0-9A-Za-z.\-]+" filecheck.php | head -n1)
          echo "Tag:                 ${{ steps.version.outputs.version }}"
          echo "filecheck.php:       $HEADER_VERSION"
          echo "FILECHECK_VERSION:   $CONST_VERSION"
          echo "readme.txt:          $README_VERSION"
          FAIL=0
          if [ "$HEADER_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Plugin header version ($HEADER_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            FAIL=1
          fi
          if [ "$CONST_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::FILECHECK_VERSION constant ($CONST_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            FAIL=1
          fi
          if [ "$README_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::readme.txt Stable tag ($README_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            FAIL=1
          fi
          exit $FAIL

      - name: Deploy to WordPress.org SVN
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: filecheck
          VERSION: ${{ steps.version.outputs.version }}
          ASSETS_DIR: .wordpress-org

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Filecheck ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.deploy.outputs.zip-path }}
